version: 4
description: >
  Computer-interface / hacking / digital-investigation oyunları üçün deterministik theme-candidate retrieval taxonomy.
  Bu qaydalar final semantic classification deyil; review-ləri sonrakı aspect analysis
  və manual/LLM audit üçün namizəd kimi seçir.
themes:
  HACKER_FANTASY:
    label_az: Hacker fantasy-si
    patterns:
      - '\bfeel(?:s|ing)? like (?:a |an )?(?:real )?hacker\b'
      - '\b(?:be|being|become|becoming) (?:a |an )?hacker\b'
      - '\bwannabe hacker\b'
      - '\bhackerman\b'
      - '\bhacker fantasy\b'

  IMMERSION:
    label_az: Immersion və atmosferə daxil olma
    patterns:
      - '\bimmers(?:ive|ion|ed)\b'
      - '\bimmersed\b'
      - '\bfelt like\b'
      - '\bmakes? (?:me|you) feel\b'

  TERMINAL_UI:
    label_az: Terminal və command-line interfeysi
    patterns:
      - '\bterminal\b'
      - '\bcommand[- ]?line\b'
      - '\bcli\b'
      - '\bshell\b'
      - '\bunix\b'
      - '\blinux\b'
      - '\bbash\b'
      - '\bcommands?\b'

  STORY_NARRATIVE:
    label_az: Story və narrative
    patterns:
      - '\bstory(?:line)?\b'
      - '\bplot\b'
      - '\bnarrative\b'
      - '\bcharacters?\b'
      - '\bending\b'
      - '\bstorytelling\b'

  INVESTIGATION_DISCOVERY:
    label_az: Araşdırma, kəşf və clue tapma
    patterns:
      - '\binvestigat(?:e|ion|ing)\b'
      - '\bdetective\b'
      - '\bdiscover(?:y|ed|ing)?\b'
      - '\bexplor(?:e|ing|ation|able)\b'
      - '\bclues?\b'
      - '\bsecrets?\b'
      - '\bsnoop(?:ing)?\b'
      - '\btreasure hunt\b'

  SOUND_AUDIO:
    label_az: Soundtrack və audio
    patterns:
      - '\bsoundtrack\b'
      - '\bmusic\b'
      - '\baudio\b'
      - '\bsound design\b'
      - '\bsounds?\b'

  REPETITION:
    label_az: Təkrarçılıq
    patterns:
      - '\brepetit(?:ive|ion|ious)\b'
      - '\bmonoton(?:ous|y)\b'
      - '\brinse and repeat\b'
      - '\bsame commands?\b'
      - '\bsame thing(?:s)?\b'
      - '\bover and over\b'
      - '\btedious\b'
      - '\bchore\b'

  DEPTH_CHALLENGE:
    label_az: Dərinlik, challenge və problem həlli
    patterns:
      - '\bdepth\b'
      - '\bshallow\b'
      - '\bchalleng(?:e|ing|ed)\b'
      - '\bproblem[- ]?solving\b'
      - '\bstrategy\b'
      - '\bpuzzles?\b'
      - '\btoo easy\b'
      - '\btoo hard\b'
      - '\bdifficult(?:y)?\b'

  REALISM_ACCURACY:
    label_az: Realizm və texniki düzgünlük
    patterns:
      - '\brealis(?:m|tic|tically)\b'
      - '\breal hacking\b'
      - '\bactual hacking\b'
      - '\binaccura(?:te|cy)\b'
      - '\baccur(?:ate|acy)\b'
      - '\bauthentic(?:ity)?\b'
      - '\breal unix\b'
      - '\breal[- ]world\b'

  ONBOARDING_CLARITY:
    label_az: Onboarding, tutorial və aydınlıq
    patterns:
      - '\btutorial\b'
      - '\bhand[- ]?holding\b'
      - '\binstructions?\b'
      - '\bunclear\b'
      - '\bconfus(?:ing|ed)\b'
      - '\blearning curve\b'
      - '\bhelp (?:page|command|list)\b'
      - '\bmemor(?:ize|ise|izing|ising) commands?\b'
      - '\brelearn\b'

  WORLD_REACTIVITY:
    label_az: Consequence, urgency və dünyanın reaktivliyi
    patterns:
      - '\bconsequences?\b'
      - '\bworld (?:is|feels) (?:not )?alive\b'
      - '\bno sense of urgency\b'
      - '\burgency\b'
      - '\benemy hackers?\b'
      - '\blogs? (?:are|were|feel|felt) useless\b'
      - '\bno point (?:in )?(?:deleting|clearing) (?:the )?logs?\b'
      - '\breactiv(?:e|ity)\b'

  UI_USABILITY:
    label_az: UI/UX və istifadə rahatlığı
    patterns:
      - '\binterface\b'
      - '\bui\b'
      - '\bautocomplete\b'
      - '\bauto[- ]?complete\b'
      - '\bscroll\b'
      - '\bfile management\b'
      - '\bcluttered\b'
      - '\bunintuitive\b'
      - '\bkeyboard only\b'

  BUGS_COMPATIBILITY:
    label_az: Bug və compatibility
    patterns:
      - '\bbugs?\b'
      - '\bcrash(?:es|ed|ing)?\b'
      - '\bfreez(?:e|es|ing)\b'
      - '\bsoft[- ]?lock(?:ed|ing)?\b'
      - '\bcorrupt(?:ed|ion)?\b'
      - '\bblack screen\b'
      - '\bwon.t launch\b'
      - '\bwouldn.t launch\b'
      - '\bdoesn.t start\b'
      - '\bcompatibility\b'
      - '\bresolution\b'
      - '\bmemory leak\b'

  LENGTH_CONTENT:
    label_az: Oyun uzunluğu və content miqdarı
    patterns:
      - '\btoo short\b'
      - '\breally short\b'
      - '\bgame (?:is|was|feels|felt) short\b'
      - '\bgame length\b'
      - '\blength\b'
      - '\bmore content\b'
      - '\bnot enough content\b'

  MOD_REPLAYABILITY:
    label_az: Mod, Workshop və replayability
    patterns:
      - '\bmods?\b'
      - '\bmod support\b'
      - '\bworkshop\b'
      - '\breplay(?:ability|able|ed|ing)?\b'
      - '\bcustom (?:campaigns?|missions?|extensions?)\b'
      - '\bextension framework\b'

  PLAYER_AGENCY:
    label_az: Seçim və player agency
    patterns:
      - '\bno choices?\b'
      - '\bmeaningful choices?\b'
      - '\blinear(?:ity)?\b'
      - '\bmultiple endings?\b'
      - '\bbranching (?:story|storyline|path|paths)\b'
      - '\bforced to\b'
      - '\bonly one way\b'
      - '\bfreedom\b'

  PACING_WAITING:
    label_az: Pacing, gözləmə və temp
    patterns:
      - '\bpacing\b'
      - '\btoo slow\b'
      - '\bslow pacing\b'
      - '\bwait(?:ing)? around\b'
      - '\bwaiting for (?:the )?(?:same|tool|program|animation|process|hack)\b'
      - '\bwatching animations?\b'
      - '\btime pressure\b'

  EDUCATIONAL_IMPACT:
    label_az: Öyrənmə və texnologiyaya maraq yaratma
    patterns:
      - '\blearn(?:ed|t|ing)? (?:linux|unix|commands?|programming|coding|networking|cybersecurity)\b'
      - '\btaught me\b'
      - '\binspired me\b'
      - '\bstarted my love for computers\b'
      - '\bintroduction to\b'
      - '\bgot me into\b'


  TACTICAL_TURN_BASED:
    label_az: Turn-based taktika və action economy
    patterns:
      - '\bturn[- ]based\b'
      - '\btactical\b'
      - '\baction economy\b'
      - '\btwo actions?\b'
      - '\baction points?\b'
      - '\bboard game\b'
      - '\bchess\b'

  RNG_FAIRNESS:
    label_az: RNG, luck və fairness
    patterns:
      - '\brng\b'
      - '\brandom(?:ness|ly)?\b'
      - '\bluck(?:y|ier|iest)?\b'
      - '\bbad luck\b'
      - '\bdice rolls?\b'
      - '\bpercentage[- ]based\b'
      - '\bprocgen\b'
      - '\bunwinnable\b'

  RETRY_ROLLBACK:
    label_az: Retry, rollback və mission recovery
    patterns:
      - '\brollback(?:s|ing)?\b'
      - '\brestart(?:ing|ed)? (?:the )?(?:mission|level|map)\b'
      - '\bretry(?:ing|ied)?\b'
      - '\bdo[- ]?overs?\b'
      - '\bsave scumm(?:ing|ed)?\b'
      - '\breplay failed missions?\b'
      - '\bone chance\b'
      - '\blocked out\b'
      - '\bmanual save\b'
      - '\bno save\b'
      - '\bundo\b'

  LOADOUT_BUILD:
    label_az: Loadout, deck və build seçimi
    patterns:
      - '\bloadout\b'
      - '\bdeck\b'
      - '\bprograms?\b'
      - '\bhardware\b'
      - '\btoolset\b'
      - '\btools?\b'
      - '\bslots?\b'
      - '\bbuilds?\b'
      - '\bconfiguration\b'
      - '\bequip(?:ped|ment)?\b'

  KEYBOARD_ONLY:
    label_az: Keyboard-only control
    patterns:
      - '\bkeyboard[- ]only\b'
      - '\bkeyboard only\b'
      - '\bno mouse\b'
      - '\bwithout (?:a )?mouse\b'
      - '\btyping commands?\b'
      - '\btype commands?\b'
      - '\bcommand[- ]driven\b'

  URGENCY_TRACE:
    label_az: Trace, turn cap və urgency
    patterns:
      - '\btrace meter\b'
      - '\btrace counter\b'
      - '\btrace mechanic\b'
      - '\bgetting traced\b'
      - '\bbeing traced\b'
      - '\bturn caps?\b'
      - '\bturn limits?\b'
      - '\btime limits?\b'
      - '\bcountdown\b'
      - '\btrace time\b'

  CHOICE_REPUTATION:
    label_az: Moral seçim, reputation və branching
    patterns:
      - '\breputation\b'
      - '\bblack hat\b'
      - '\bwhite hat\b'
      - '\bmoral(?:ity)?\b'
      - '\bethics?\b'
      - '\bchoices? matter\b'
      - '\bstory branching\b'
      - '\bbranching dialogue\b'
      - '\bside quests?\b'
      - '\bside missions?\b'


  LOCALIZATION_WRITING:
    label_az: Lokalizasiya, yazı və dialoq keyfiyyəti
    patterns:
      - '\btranslat(?:e|ed|ion|ions)\b'
      - '\bgrammar\b'
      - '\bgrammatical\b'
      - '\bspelling\b'
      - '\btypos?\b'
      - '\bbroken english\b'
      - '\benglish (?:is|was|version)\b'
      - '\bdialogue\b'
      - '\bwriting\b'
      - '\bwording\b'
      - '\bvoice acting\b'
      - '\bvoice actors?\b'
      - '\bpronunciation\b'

  LINEARITY_SCRIPTING:
    label_az: Linearity və sərt scripted progression
    patterns:
      - '\blinear(?:ity)?\b'
      - '\bin order\b'
      - '\bright (?:part|point|time)\b'
      - '\bexact (?:piece|clue|evidence|answer)\b'
      - '\bpredefined\b'
      - '\brailroad(?:ed|ing)?\b'
      - '\bone (?:correct )?(?:path|way)\b'
      - '\bsequence break\b'
      - '\bwon.t let you\b'
      - '\bdoesn.t let you\b'
      - '\bforced to\b'

  CLUE_EVIDENCE_QUALITY:
    label_az: Clue və evidence keyfiyyəti
    patterns:
      - '\bclues?\b'
      - '\bevidence\b'
      - '\bpertinent\b'
      - '\brelevant\b'
      - '\bhighlight(?:ed|ing)?\b'
      - '\bhover(?:ing)?\b'
      - '\bmissing (?:a )?clue\b'
      - '\blast clue\b'

  DEDUCTION_REASONING:
    label_az: Deduction və reasoning
    patterns:
      - '\bdeduct(?:ion|ive)\b'
      - '\breasoning\b'
      - '\blogic(?:al)?\b'
      - '\bfigure out\b'
      - '\bpiece(?:d|ing)? (?:it|the story|things) together\b'
      - '\bguess(?:ing)?\b'
      - '\baha\b'

  PUZZLE_CLARITY:
    label_az: Puzzle aydınlığı və fairness
    patterns:
      - '\bpuzzles?\b'
      - '\briddles?\b'
      - '\bminigames?\b'
      - '\binstructions?\b'
      - '\bexplain(?:ed|ation)?\b'
      - '\bconfus(?:ing|ed)\b'
      - '\bunclear\b'
      - '\bcryptic\b'
      - '\barbitrary\b'
      - '\btrial and error\b'

  INFORMATION_SEARCH:
    label_az: Information search və data gathering
    patterns:
      - '\bsearch(?:ing)?\b'
      - '\bgoogl(?:e|ing)\b'
      - '\bgogo\b'
      - '\btoothbook\b'
      - '\bprofiles?\b'
      - '\baccounts?\b'
      - '\bemails?\b'
      - '\bwebpages?\b'
      - '\bdata[- ]collection\b'
      - '\bgather(?:ing)? (?:data|information|clues)\b'

  SOCIAL_ENGINEERING:
    label_az: Social engineering və phishing
    patterns:
      - '\bphish(?:ing)?\b'
      - '\bsocial engineering\b'
      - '\bimpersonat(?:e|ing|ion)\b'
      - '\banonymous call\b'
      - '\bphone call\b'

  TIMED_EVENTS:
    label_az: Timed event və time-limit friction
    patterns:
      - '\btime limit\b'
      - '\btimed\b'
      - '\btimer\b'
      - '\bcountdown\b'
      - '\btime sensitive\b'

  PUBLIC_OPINION_MINIGAME:
    label_az: Public opinion / influence minigame
    patterns:
      - '\bpublic (?:image|opinion|influence)\b'
      - '\bmedia articles?\b'
      - '\bpopularity\b'

  ETHICAL_SOCIAL_THEME:
    label_az: Etik və sosial mövzular
    patterns:
      - '\bprivacy\b'
      - '\bcyber violence\b'
      - '\bcyberbully(?:ing)?\b'
      - '\bbullying\b'
      - '\bharassment\b'
      - '\bmoral(?:ity)?\b'
      - '\bethic(?:s|al)?\b'
      - '\bsocial issues?\b'
      - '\bpreach(?:y|ing)?\b'


  HANDHOLDING_GUIDANCE:
    label_az: Həddindən artıq yönləndirmə və hand-holding
    patterns:
      - '\bhand[- ]?holding\b'
      - '\bholds? your hand\b'
      - '\btreats? you like (?:an )?idiot\b'
      - '\btells? you exactly\b'
      - '\bspoon[- ]?fed\b'
      - '\bspoonfeeding\b'

  ENDING_CLOSURE:
    label_az: Ending, closure və cliffhanger
    patterns:
      - '\bending\b'
      - '\bcliff[- ]?hanger\b'
      - '\babrupt ending\b'
      - '\bunsatisfying ending\b'
      - '\bno closure\b'
      - '\bno resolution\b'
      - '\bunresolved\b'
      - '\bsequel bait\b'

  SAVE_REPLAY:
    label_az: Save, replay və skippability
    patterns:
      - '\bmanual save\b'
      - '\bno save\b'
      - '\bsave system\b'
      - '\bautosave\b'
      - '\bunskippable\b'
      - '\bcan.t skip\b'
      - '\bcannot skip\b'
      - '\breplayability\b'
      - '\breplay value\b'

  SINGLE_USE_MECHANICS:
    label_az: Bir dəfə istifadə olunan və zəif dərinləşdirilən mechanic-lər
    patterns:
      - '\bused only once\b'
      - '\bonly used once\b'
      - '\buse it once\b'
      - '\bnever used again\b'
      - '\bone[- ]off mechanic\b'
      - '\bone[- ]off mechanics\b'
      - '\bunderused\b'
      - '\bunder-utilised\b'
      - '\bunderutilized\b'

  DIALOGUE_EXPOSITION:
    label_az: Dialogue, exposition və passiv dinləmə
    patterns:
      - '\bexposition\b'
      - '\bexposition-heavy\b'
      - '\bvoice acting\b'
      - '\bvoice actor\b'
      - '\blistening to\b'
      - '\blisten to\b'
      - '\bcutscenes?\b'
      - '\bblack screen\b'
